        '200': {description: Suggestion, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularySuggestionEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
  /api/vocabulary/sets:
