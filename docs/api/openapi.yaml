      tags: [Vocabulary teacher]
      summary: Tạo bộ từ và items atomic
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateVocabularySetRequest'}}}}
      responses:
        '201': {description: Đã tạo, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularySetEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
  /api/vocabulary/sets/import-public-unit:
    post:
      tags: [Vocabulary teacher]
