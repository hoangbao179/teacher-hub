      responses:
        '200': {description: Exception và conflict warnings, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleExceptionEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/schedule/week:
