                name: {type: string}
                size: {type: integer, maximum: 10485760}
                sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            lessons: {type: array, items: {type: object}}
            tuitionRows: {type: array, items: {type: object}}
            paymentEvents: {type: array, items: {type: object}}
            tuitionCycles: {type: array, items: {type: object}}
            tuitionCyclePlans: {type: array, items: {type: object}, description: Kế hoạch cycle theo block và source rows; Apply giữ nguyên danh sách member này}
            minimalLessonGroups: {type: array, items: {type: object}, description: Nhóm dòng học phí có thể tạo lesson lịch sử tối giản}
            timeMappings: {type: array, items: {type: object}}
            academicPeriods: {type: array, items: {type: object}}
            classCandidates: {type: array, items: {type: object}}
            rows: {type: array, items: {$ref: '#/components/schemas/LegacyImportRow'}}
            summary: {type: object}
            warnings: {type: array, items: {type: string}}
    LegacyImportRow:
      type: object
      required: [id, rowType, sourceSheet, sourceRow, rawValues, normalizedValues, issueCodes, status, supportedActions]
      properties:
        id: {type: string}
        rowType: {type: string, enum: [LESSON, TUITION, TUITION_GROUP, PAYMENT, ACADEMIC_PERIOD, TIME_MAPPING]}
        sourceSheet: {type: string}
        sourceRow: {type: integer, minimum: 1}
        rawValues: {type: object, additionalProperties: true}
        normalizedValues: {type: object, additionalProperties: true}
        issueCodes: {type: array, uniqueItems: true, items: {type: string}}
        status: {type: string, enum: [VALID, NEEDS_REVIEW, BLOCKED, RESOLVED, SKIPPED]}
        supportedActions: {type: array, uniqueItems: true, items: {type: string}}
        suggestedResolution: {$ref: '#/components/schemas/LegacyImportRowDecision'}
    LegacyImportRowDecision:
      type: object
      required: [sourceSheet, sourceRow, issueCode, action]
      properties:
        sourceSheet: {type: string}
        sourceRow: {type: integer, minimum: 1}
        issueCode: {type: string}
        action: {type: string, enum: [EDIT_ROW, CONFIRM_STUDENT, SET_ATTENDANCE, MAP_ACADEMIC_PERIOD, MATCH_EXISTING_LESSON, CREATE_LESSON, KEEP_EXISTING_LESSON, USE_IMPORTED_LESSON, EDIT_LESSON_CONTENT, CONFIRM_PAYMENT, CONFIRM_TIME_MAPPING, CREATE_MINIMAL_LEGACY_LESSONS, EXCLUDE_FINANCE_BLOCK, SKIP]}
        resolvedValue: {nullable: true}
        reason: {type: string, enum: [UNIDENTIFIABLE_DATA, DUPLICATE_ROW, WRONG_STUDENT, NOT_NEEDED, OTHER]}
    LegacyImportApplyEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [importId, idempotent, acceptedRowCount, resolvedRowCount, skippedRowCount, importedLessonCount, matchedLessonCount, importedAttendanceCount, importedClassCount, importedEnrollmentCount, importedTuitionCycleCount]
          properties:
            importId: {type: integer, format: int64}
            idempotent: {type: boolean}
            acceptedRowCount: {type: integer}
            resolvedRowCount: {type: integer}
            skippedRowCount: {type: integer}
            importedLessonCount: {type: integer}
            matchedLessonCount: {type: integer}
            importedAttendanceCount: {type: integer}
            importedClassCount: {type: integer}
            importedEnrollmentCount: {type: integer}
            importedTuitionCycleCount: {type: integer}
    StudentGoogleSheet:
      type: object
      required: [id, studentId, fileName, templateVersion, status, sharingStatus, generationStartedAt, canRetryGeneration, createdAt]
      properties:
        id: {type: integer, format: int64}
        studentId: {type: integer, format: int64}
        legacyImportId: {type: integer, format: int64, nullable: true}
        fileName: {type: string}
        webViewUrl: {type: string, format: uri, nullable: true}
        templateVersion: {type: string}
        status: {type: string, enum: [CREATING, ACTIVE, GENERATION_ERROR, ARCHIVED]}
        sharingStatus: {type: string, enum: [RESTRICTED, MANUALLY_SHARED]}
        lastGeneratedAt: {type: string, format: date-time, nullable: true}
        lastSyncedAt: {type: string, format: date-time, nullable: true}
        lastSyncError: {type: string, nullable: true}
        generationStartedAt: {type: string, format: date-time, nullable: true}
        canRetryGeneration: {type: boolean}
        createdAt: {type: string, format: date-time}
    CreateStudentGoogleSheetRequest:
      type: object
      properties:
        legacyImportId: {type: integer, format: int64, minimum: 1}
        forceRegenerate: {type: boolean, default: false, description: Chưa expose trong UI; true bị từ chối và phải dùng endpoint regenerate}
    StudentGoogleSheetStateEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [enabled, syncEnabled, sheet, pendingCount, retryCount, deadCount, lastSuccessfulSyncAt, lastSyncError]
          properties:
            enabled: {type: boolean}
            syncEnabled: {type: boolean}
            ownerLabel: {type: string, nullable: true}
            sheet: {allOf: [{$ref: '#/components/schemas/StudentGoogleSheet'}], nullable: true}
            pendingCount: {type: integer, minimum: 0}
            retryCount: {type: integer, minimum: 0}
            deadCount: {type: integer, minimum: 0}
            lastSuccessfulSyncAt: {type: string, format: date-time, nullable: true}
            lastSyncError: {type: string, nullable: true}
    StudentGoogleSheetMutationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [sheet, reused]
          properties:
            sheet: {$ref: '#/components/schemas/StudentGoogleSheet'}
            reused: {type: boolean}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: MISSING_ATTENDANCE}
            message: {type: string}
            details: {nullable: true}
