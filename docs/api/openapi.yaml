        '200': {description: Thành công, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/TeacherBusySlot'}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Cập nhật lịch bận và trả cảnh báo xung đột
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TeacherBusySlotInput'}}}}
      responses:
        '200': {description: Đã cập nhật, content: {application/json: {schema: {$ref: '#/components/schemas/TeacherBusySlotMutationEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: Xóa lịch bận; không có tác động attendance hoặc tuition
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Đã xóa}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/public/vocabulary-media/{mediaId}:
    get:
      security: []
      tags: [Vocabulary public]
      summary: Đọc rendition immutable của media đã lưu
      parameters:
        - {$ref: '#/components/parameters/MediaId'}
        - {in: query, name: variant, schema: {type: string, enum: [GAME, THUMBNAIL], default: GAME}}
      responses:
        '200':
          description: Binary cùng origin; media ID không bị ghi đè
          headers:
            Cache-Control: {schema: {type: string}, example: 'public, max-age=31536000, immutable'}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/public/learning-assignments/{publicCode}:
    get:
      security: []
