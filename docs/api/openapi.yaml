      responses:
        '200': {description: Trang topic, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularyTopicListEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
  /api/vocabulary/topics/{slug}:
    get:
      tags: [Vocabulary teacher]
      summary: Topic cùng core/extended words
      parameters:
        - {in: path, name: slug, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
        - {$ref: '#/components/parameters/AgeBandQuery'}
      responses:
        '200': {description: Topic detail, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularyTopicEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/vocabulary/topic-suggestions:
    post:
      tags: [Vocabulary teacher]
      summary: Gợi ý deterministic từ catalog, không tự publish
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularyTopicSuggestionRequest'}}}}
