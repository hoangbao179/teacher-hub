components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    StudentId: {in: path, name: studentId, required: true, schema: {type: integer, format: int64, minimum: 1}}
    OccurrenceKey: {in: path, name: key, required: true, schema: {type: string, maxLength: 160}, example: '12:34:2026-07-20'}
    MediaId: {in: path, name: mediaId, required: true, schema: {type: integer, format: int64, minimum: 1}}
    PublicCode: {in: path, name: publicCode, required: true, schema: {type: string, pattern: '^[A-Z2-9]{8}$'}}
    SessionToken: {in: path, name: sessionToken, required: true, schema: {type: string, minLength: 43, maxLength: 128}, description: Raw token; database chỉ lưu SHA-256 hash}
    AgeBandQuery: {in: query, name: ageBand, schema: {$ref: '#/components/schemas/VocabularyAgeBand'}}
    SearchQuery: {in: query, name: search, schema: {type: string, maxLength: 100}}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
  responses:
    ValidationError:
      description: Dữ liệu không hợp lệ
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Conflict:
      description: State, participant, policy hoặc concurrency conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    NotFound:
      description: Không tìm thấy tài nguyên
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    UnprocessableContent:
      description: Shape hợp lệ nhưng nội dung không thể import/publish/play an toàn
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    RateLimited:
      description: Quá giới hạn riêng của public/provider API
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  schemas:
    VocabularyAgeBand:
      type: string
      enum: [PRESCHOOL_G1, G2_G3, G4_G5, G6_G9]
    VocabularyMediaKind:
      type: string
      enum: [NONE, EMOJI, PUBLIC_ASSET, STORED_MEDIA]
    VocabularyTier:
      type: string
      enum: [CORE, EXTENDED, CUSTOM]
    VocabularySourceType:
      type: string
      enum: [TOPIC_CATALOG, PUBLIC_UNIT, COPIED, MANUAL]
    VocabularySourceReference:
      type: object
      additionalProperties: false
      description: Metadata provenance; không thay content snapshot.
      properties:
        topicSlug: {type: string, minLength: 1, maxLength: 100}
        unitId: {type: string, minLength: 1, maxLength: 100}
        levelSlug: {type: string, enum: [mam-non, lop-1, lop-2, lop-3, lop-4, lop-5, lop-6, lop-7, lop-8, lop-9]}
        contentVersion: {type: integer, minimum: 1}
        copiedSetId: {type: integer, format: int64, minimum: 1}
    VocabularyItemInput:
      type: object
      required: [displayOrder, word, meaningVi, tier, illustration, supportsImageGame]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        sourceTopicWordId: {type: integer, format: int64, minimum: 1}
        displayOrder: {type: integer, minimum: 1, maximum: 100}
        word: {type: string, minLength: 1, maxLength: 100}
        meaningVi: {type: string, minLength: 1, maxLength: 200}
        phonetic: {type: string, maxLength: 100}
        partOfSpeech: {type: string, maxLength: 50}
        exampleEn: {type: string, maxLength: 500}
        speechText: {type: string, minLength: 1, maxLength: 200}
        tier: {$ref: '#/components/schemas/VocabularyTier'}
        illustration: {$ref: '#/components/schemas/VocabularyIllustration'}
        supportsImageGame: {type: boolean}
        imageSearchTerms: {type: array, maxItems: 5, items: {type: string, minLength: 2, maxLength: 100}}
    VocabularyIllustration:
      type: object
      required: [kind]
      description: Chỉ field tương ứng kind được phép có giá trị.
      properties:
        kind: {$ref: '#/components/schemas/VocabularyMediaKind'}
        value: {type: string, maxLength: 500, description: Emoji hoặc đường dẫn bắt đầu bằng /learning/ tùy kind}
        mediaId: {type: integer, format: int64, minimum: 1}
    VocabularySet:
      type: object
      required: [id, title, description, sourceType, ageBand, status, itemCount, updatedAt]
      properties:
        id: {type: integer, format: int64}
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 2000}
        sourceType: {$ref: '#/components/schemas/VocabularySourceType'}
        sourceReference: {allOf: [{$ref: '#/components/schemas/VocabularySourceReference'}], nullable: true}
        ageBand: {$ref: '#/components/schemas/VocabularyAgeBand'}
        status: {type: string, enum: [ACTIVE, ARCHIVED]}
        itemCount: {type: integer, minimum: 0, maximum: 100}
        updatedAt: {type: string, format: date-time}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/VocabularyItemInput'}}
    CreateVocabularySetRequest:
      type: object
      required: [title, sourceType, ageBand, items]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 2000}
        sourceType: {$ref: '#/components/schemas/VocabularySourceType'}
        sourceReference: {$ref: '#/components/schemas/VocabularySourceReference'}
        ageBand: {$ref: '#/components/schemas/VocabularyAgeBand'}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/VocabularyItemInput'}}
    UpdateVocabularySetRequest:
      type: object
      required: [title, ageBand, items]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 2000}
        ageBand: {$ref: '#/components/schemas/VocabularyAgeBand'}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/VocabularyItemInput'}}
    ImportPublicVocabularyUnitItem:
      type: object
      required: [id, word, meaningVi, illustration]
      properties:
        id: {type: string, minLength: 1, maxLength: 100}
        word: {type: string, minLength: 1, maxLength: 100}
        meaningVi: {type: string, minLength: 1, maxLength: 200}
        phonetic: {type: string, maxLength: 100}
        speechText: {type: string, maxLength: 200}
        exampleEn: {type: string, maxLength: 500}
        illustration: {$ref: '#/components/schemas/VocabularyIllustration'}
    ImportPublicVocabularyUnitRequest:
      type: object
      required: [unitId, levelSlug, contentVersion, title, ageBand, items]
      properties:
        unitId: {type: string, minLength: 1, maxLength: 100}
        levelSlug: {type: string, enum: [mam-non, lop-1, lop-2, lop-3, lop-4, lop-5, lop-6, lop-7, lop-8, lop-9]}
        contentVersion: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 2000}
        ageBand: {$ref: '#/components/schemas/VocabularyAgeBand'}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/ImportPublicVocabularyUnitItem'}}
    VocabularySetEnvelope:
      type: object
      required: [data]
      properties: {data: {$ref: '#/components/schemas/VocabularySet'}}
    VocabularySetListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/VocabularySet'}}
        meta: {$ref: '#/components/schemas/PageMeta'}
    VocabularyTopicWord:
      type: object
      required: [id, word, normalizedWord, meaningVi, normalizedMeaning, speechText, tier, priority, ageBands, supportsImageGame, imageSearchTerms]
      properties:
        id: {type: integer, format: int64}
        word: {type: string, maxLength: 100}
        normalizedWord: {type: string, maxLength: 100}
        meaningVi: {type: string, maxLength: 200}
        normalizedMeaning: {type: string, maxLength: 200}
        phonetic: {type: string, nullable: true, maxLength: 100}
        partOfSpeech: {type: string, nullable: true, maxLength: 50}
        exampleEn: {type: string, nullable: true, maxLength: 500}
        speechText: {type: string, maxLength: 200}
        tier: {type: string, enum: [CORE, EXTENDED]}
        priority: {type: integer, minimum: 1}
        ageBands: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/VocabularyAgeBand'}}
        supportsImageGame: {type: boolean}
        imageSearchTerms: {type: array, maxItems: 5, items: {type: string, minLength: 2, maxLength: 100}}
        selected: {type: boolean}
    VocabularyTopic:
      type: object
      required: [id, slug, titleVi, iconKey, ageBands, coreWordCount, extendedWordCount]
      properties:
        id: {type: integer, format: int64}
        slug: {type: string, maxLength: 100}
        titleVi: {type: string, minLength: 1, maxLength: 160}
        descriptionVi: {type: string, maxLength: 2000}
        iconKey: {type: string, maxLength: 50}
        ageBands: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/VocabularyAgeBand'}}
