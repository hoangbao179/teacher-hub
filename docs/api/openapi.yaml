        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/public/learning-attempts/{sessionToken}/complete:
    post:
      security: []
      tags: [Vocabulary public]
      summary: Hoàn thành attempt idempotent từ answers đã lưu
      parameters: [{$ref: '#/components/parameters/SessionToken'}]
      responses:
        '200': {description: Kết quả thân thiện, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteLearningAttemptEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/public/learning-attempts/{sessionToken}/replay:
    post:
      security: []
