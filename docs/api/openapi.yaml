      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ImportPublicVocabularyUnitRequest'}}}}
      responses:
        '201': {description: Set snapshot đã tạo atomic, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularySetEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
  /api/vocabulary/sets/{id}:
    get:
      tags: [Vocabulary teacher]
      summary: Chi tiết bộ từ
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Thành công, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularySetEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Vocabulary teacher]
      summary: Cập nhật bộ từ và item atomic
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateVocabularySetRequest'}}}}
      responses:
        '200': {description: Đã cập nhật, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularySetEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
  /api/vocabulary/sets/{id}/duplicate:
    post:
      tags: [Vocabulary teacher]
      summary: Nhân bản set thành ACTIVE độc lập
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '201': {description: Bản sao, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularySetEnvelope'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/vocabulary/sets/{id}/archive:
    post:
      tags: [Vocabulary teacher]
      summary: Lưu trữ set và giữ nguyên dữ liệu lịch sử
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Đã lưu trữ}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/vocabulary/media/status:
    get:
      tags: [Vocabulary teacher]
      summary: Trạng thái provider; editor vẫn dùng emoji/public asset khi provider tắt
      responses:
        '200':
          description: Trạng thái có kiểm soát, không lộ API key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [enabled, provider, providers]
                    properties:
                      enabled: {type: boolean}
                      provider: {type: string, enum: [ARASAAC, PIXABAY], nullable: true}
                      cooldownUntil: {type: string, format: date-time}
                      providers:
                        type: array
                        items:
                          type: object
                          required: [provider, enabled]
                          properties:
                            provider: {type: string, enum: [ARASAAC, PIXABAY]}
                            enabled: {type: boolean}
                            cooldownUntil: {type: string, format: date-time}
  /api/vocabulary/media/search:
    get:
      tags: [Vocabulary teacher]
      summary: Search provider ảnh theo mediaType phía server với safe search và cache 24 giờ
      parameters:
        - {in: query, name: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
        - {in: query, name: mediaType, schema: {type: string, enum: [ALL, PHOTO, ILLUSTRATION, VECTOR], default: ALL}}
        - {in: query, name: orientation, schema: {type: string, enum: [ALL, HORIZONTAL, VERTICAL], default: ALL}}
        - {$ref: '#/components/parameters/Page'}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 3, maximum: 50, default: 20}}
      responses:
        '200': {description: Kết quả có attribution/source, content: {application/json: {schema: {$ref: '#/components/schemas/ImageSearchEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: Provider bị disable hoặc tạm không khả dụng}
  /api/vocabulary/media/import:
    post:
      tags: [Vocabulary teacher]
      summary: Import asset đã thấy trong search cache; không nhận URL
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ImportProviderImageRequest'}}}}
      responses:
        '201': {description: Asset mới hoặc deduplicate/replay đã lưu, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularyMediaEnvelope'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {description: Nguồn ảnh tạm thời không khả dụng}
        '504': {description: Tải ảnh từ nguồn quá thời gian}
  /api/vocabulary/media/upload:
    post:
      tags: [Vocabulary teacher]
      summary: Tải một ảnh JPEG/PNG/WebP tối đa 5 MiB, kiểm tra và chuyển thành hai WebP
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, altText]
              properties:
                image: {type: string, format: binary}
                altText: {type: string, minLength: 1, maxLength: 200}
      responses:
        '201': {description: Media tạm hoặc bản deduplicate, content: {application/json: {schema: {$ref: '#/components/schemas/VocabularyMediaEnvelope'}}}}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
  /api/vocabulary/media/metrics:
    get:
      tags: [Vocabulary teacher]
      summary: Dung lượng và số lượng media, tham chiếu và orphan
      responses:
        '200':
          description: Metrics media
          content:
            application/json:
              schema:
                type: object
                properties:
