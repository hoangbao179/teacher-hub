name: pdf-worker-manual
run-name: ${{ inputs.activation_request && format('PDF v2 readiness {0}', inputs.activation_request) || 'PDF Worker manual verification' }}

on:
  workflow_dispatch:
    inputs:
      activation_request:
        description: Internal deployment correlation ID (empty keeps manual verification)
        type: string
        default: ''
      source_sha:
        description: Exact production source SHA to bind readiness evidence
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cloud-run-pdf-worker
  cancel-in-progress: false

jobs:
  verify-wif:
    if: github.repository == 'hoangbao179/teacher-hub' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.activation_request == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Read-only verification; provider and IAM restrictions are independent gates.
    environment: pdf-worker
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_VERIFIER_SA: ${{ vars.GCP_VERIFIER_SA }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate read-only target
        shell: bash
        run: |
          set -euo pipefail
          test "$GCP_PROJECT_ID" = teacher-hub-pdf
          test "$GCP_REGION" = asia-southeast1
          test "$GCP_VERIFIER_SA" = teacher-pdf-verifier@teacher-hub-pdf.iam.gserviceaccount.com
          [[ "$GCP_WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Worker targeted checks
        run: |
          npm ci
          npm run build:shared
          npm ci --prefix workers/pdf
          npm --prefix workers/pdf run check
          npm --prefix workers/pdf test
          node --test scripts/validate-pdf-environment.test.cjs
          bash -n scripts/deploy-pdf-worker.sh
          bash scripts/deploy-pdf-worker.test.sh
      - name: Validate main-only environment protection
        uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/validate-pdf-environment.cjs')(github, context);
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_VERIFIER_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify WIF token exchange without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth print-access-token >/dev/null
          gcloud artifacts repositories describe teacher-pdf \
            --project="$GCP_PROJECT_ID" --location="$GCP_REGION" --format='value(name)'
          echo 'WIF impersonation and repository read succeeded; deployment permissions are not proven.' >> "$GITHUB_STEP_SUMMARY"

  v2-readiness:
    if: github.repository == 'hoangbao179/teacher-hub' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.activation_request != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pdf-worker
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate exact deployment request
        env:
          REQUEST: ${{ inputs.activation_request }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$REQUEST" =~ ^[0-9]+-[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Validate WIF environment protection
        uses: actions/github-script@v8
        with:
          script: await require('./scripts/validate-pdf-environment.cjs')(github, context);
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_VERIFIER_SA }}
          project_id: teacher-hub-pdf
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify live revisions, digests, IAM, resources and queue
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/pdf-v2-readiness.mjs "$SOURCE_SHA" > "$RUNNER_TEMP/pdf-v2-readiness.json"
      # Nonsecret machine input, not a test log/screenshot. Expires after one day;
      # VPS additionally requires source SHA equality and freshness <=30 minutes.
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-v2-readiness-${{ inputs.activation_request }}
          path: ${{ runner.temp }}/pdf-v2-readiness.json
          retention-days: 1
