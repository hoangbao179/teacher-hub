name: PDF Worker Cloud Run release

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: pdf-worker-cloudrun-production
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.repository == 'hoangbao179/teacher-hub' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PDF_WORKER_AUTO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: pdf-worker-deploy
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CLOUD_PROJECT: teacher-hub-pdf
      CLOUD_REGION: asia-southeast1
      WORKER: teacher-pdf-worker
      REGISTRY: asia-southeast1-docker.pkg.dev/teacher-hub-pdf/teacher-pdf
      WORKER_URL: https://teacher-pdf-worker-851777150171.asia-southeast1.run.app
      PDF_WORKER_AUTO_DEPLOY_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate source SHA and isolated deployer
        env:
          PROVIDER: ${{ vars.PDF_DEPLOY_WIF_PROVIDER }}
          DEPLOYER: ${{ vars.PDF_DEPLOYER_SA }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]
          [[ "$DEPLOYER" == 'teacher-pdf-deployer@teacher-hub-pdf.iam.gserviceaccount.com' ]]
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      # setup-node ships npm 11, while the repository requires npm 12.
      - name: Install pinned npm for PDF Worker release
        run: npm install -g npm@12.0.1
      - run: |
          npm ci
          npm run build:shared
      - name: Validate main-only deploy environment before WIF
        uses: actions/github-script@v8
        with:
          script: await require('./scripts/validate-pdf-environment.cjs').release(github, context);
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PDF_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.PDF_DEPLOYER_SA }}
          project_id: teacher-hub-pdf
      - uses: google-github-actions/setup-gcloud@v3
      - name: Readiness and rollback target
        id: old
        run: |
          set -Eeuo pipefail
          node scripts/pdf-worker-auto-release.mjs preflight "$SOURCE_SHA" > "$RUNNER_TEMP/old.json"
          node -e 'console.log("revision="+require(process.argv[1]).previousRevision)' "$RUNNER_TEMP/old.json" >> "$GITHUB_OUTPUT"
      - run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
      - name: Build single-platform immutable image
        run: |
          set -Eeuo pipefail
          docker buildx build --pull --platform linux/amd64 --provenance=false --sbom=false \
            --metadata-file "$RUNNER_TEMP/worker-build.json" \
            --file workers/pdf/Dockerfile --tag "$REGISTRY/$WORKER:$SOURCE_SHA" --push .
      - name: Resolve manifest digest
        id: image
        run: |
          set -Eeuo pipefail
          d="$(gcloud artifacts docker images describe "$REGISTRY/$WORKER:$SOURCE_SHA" --project="$CLOUD_PROJECT" --format='value(image_summary.digest)')"
          [[ "$d" =~ ^sha256:[a-f0-9]{64}$ ]]
          built="$(node -e 'console.log(require(process.argv[1])["containerimage.digest"])' "$RUNNER_TEMP/worker-build.json")"
          test "$d" = "$built"
          echo "digest=$d" >> "$GITHUB_OUTPUT"
      - name: Stage zero-traffic canary
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          gcloud run deploy "$WORKER" --project="$CLOUD_PROJECT" --region="$CLOUD_REGION" \
            --image="$REGISTRY/$WORKER@$IMAGE_DIGEST" \
            --service-account=teacher-pdf-worker@teacher-hub-pdf.iam.gserviceaccount.com \
            --no-traffic --tag=pdf-ci --cpu=1 --memory=2Gi --concurrency=1 \
            --min=0 --max=1 --min-instances=0 --max-instances=1 --timeout=180 \
            --no-cpu-boost --cpu-throttling --port=8080 --ingress=all \
            --update-env-vars=PDF_PROCESSING_ENABLED=true,PDF_WORKER_IAM_READY=true,PDF_TEMP_ROOT=/tmp/pdf-worker,PDF_PRINT_FALLBACK_ENABLED=true,PDF_VIEWER_SCREEN_CAPTURE_ENABLED=true,PDF_CHUNKED_JOBS_ENABLED=true \
            --add-volume=name=pdf-temp,type=in-memory,size-limit=384Mi,mount-path=/tmp/pdf-worker --quiet
      - name: Check staged revision and live traffic
        id: canary
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          OLD_REV: ${{ steps.old.outputs.revision }}
        run: |
          set -Eeuo pipefail
          node scripts/pdf-worker-auto-release.mjs staged "$SOURCE_SHA" "$IMAGE_DIGEST" "$OLD_REV" > "$RUNNER_TEMP/canary.json"
          node -e 'const x=require(process.argv[1]); console.log("revision="+x.revision); console.log("url="+x.canaryURL)' "$RUNNER_TEMP/canary.json" >> "$GITHUB_OUTPUT"
      - name: Mint audience-bound canary identity token
        id: smoke-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PDF_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.PDF_DEPLOYER_SA }}
          project_id: teacher-hub-pdf
          token_format: id_token
          id_token_audience: https://teacher-pdf-worker-851777150171.asia-southeast1.run.app
          id_token_include_email: true
      - name: Authenticated canary smoke
        env:
          CANARY_URL: ${{ steps.canary.outputs.url }}
          ID_TOKEN: ${{ steps.smoke-auth.outputs.id_token }}
        run: |
          set -Eeuo pipefail
          [[ -n "$ID_TOKEN" ]]
          curl --fail --silent --show-error --retry 2 --max-time 30 \
            -H "Authorization: Bearer $ID_TOKEN" "$CANARY_URL/health" > "$RUNNER_TEMP/health.json"
          node -e 'if(require(process.argv[1]).status!=="ok")process.exit(1)' "$RUNNER_TEMP/health.json"
      - name: Recheck candidate and unchanged production traffic after smoke
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          OLD_REV: ${{ steps.old.outputs.revision }}
        run: node scripts/pdf-worker-auto-release.mjs staged "$SOURCE_SHA" "$IMAGE_DIGEST" "$OLD_REV"
      # Auto promotion is an explicit one-time repository variable opt-in.
      # Do not promote while ANY existing Cloud Task could be executing or retrying.
      - name: Auto-promote guarded canary when enabled and queue drained
        if: ${{ vars.PDF_WORKER_AUTO_PROMOTE_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.canary.outputs.revision }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          OLD_REV: ${{ steps.old.outputs.revision }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE" =~ ^teacher-pdf-worker-[a-z0-9-]+$ ]]
          # A superseded pipeline must not overwrite the newest main revision.
          newest="$(gh api repos/hoangbao179/teacher-hub/git/ref/heads/main --jq '.object.sha')"
          [[ "$newest" == "$SOURCE_SHA" ]] || { echo 'PDF_AUTO_MAIN_MOVED'; exit 1; }
          node scripts/pdf-worker-auto-release.mjs staged "$SOURCE_SHA" "$IMAGE_DIGEST" "$OLD_REV" > "$RUNNER_TEMP/pre-promote.json"
          node -e 'const d=require(process.argv[1]);if(d.revision!==process.argv[2])process.exit(1)' "$RUNNER_TEMP/pre-promote.json" "$CANDIDATE"
          # Only switch when all pending/retrying tasks have drained. This is
          # a fail-closed snapshot, not a lock against new concurrent submissions.
          gcloud tasks list --project="$CLOUD_PROJECT" --location="$CLOUD_REGION" \
            --queue=teacher-pdf-queue --format='value(name)' > "$RUNNER_TEMP/pending-tasks.txt"
          [[ ! -s "$RUNNER_TEMP/pending-tasks.txt" ]] || { echo 'PDF_AUTO_QUEUE_NOT_DRAINED'; exit 1; }
          newest="$(gh api repos/hoangbao179/teacher-hub/git/ref/heads/main --jq '.object.sha')"
          [[ "$newest" == "$SOURCE_SHA" ]] || { echo 'PDF_AUTO_MAIN_MOVED'; exit 1; }
          gcloud run services update-traffic "$WORKER" \
            --project="$CLOUD_PROJECT" --region="$CLOUD_REGION" \
            --to-revisions="${CANDIDATE}=100" --quiet
          node scripts/pdf-worker-auto-release.mjs promoted "$SOURCE_SHA" "$IMAGE_DIGEST" "$CANDIDATE"
          {
            echo '### PDF Worker auto-promoted (protected, queue drained)'
            echo "Source: $SOURCE_SHA"
            echo "Candidate: $CANDIDATE"
            echo "Digest: $IMAGE_DIGEST"
            echo "Previous revision: $OLD_REV"
            echo 'Live traffic verified 100% for candidate. Keep previous image for rollback.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish staged candidate for operator verification
        if: ${{ vars.PDF_WORKER_AUTO_PROMOTE_ENABLED != 'true' }}
        env:
          CANDIDATE: ${{ steps.canary.outputs.revision }}
          OLD_REV: ${{ steps.old.outputs.revision }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CANARY_URL: ${{ steps.canary.outputs.url }}
        run: |
          {
            echo '### Worker staged only; production traffic was not promoted'
            echo "Source: $SOURCE_SHA"
            echo "Candidate: $CANDIDATE"
            echo "Digest: $IMAGE_DIGEST"
            echo "Canary: $CANARY_URL"
            echo "Production revision: $OLD_REV"
            echo 'Health is not a PDF functional gate. Verify authorized non-owner Viewer, filename/output/recovery, drain old dispatches and approve compatible rollback before changing traffic.'
            echo 'Follow docs/operations/cloud-run-pdf-worker.md. Workflow success means staging only.'
          } >> "$GITHUB_STEP_SUMMARY"
      # Independent, fail-closed maintenance. Does not alter traffic or image staging.
      # Use the same protected WIF deployer identity; never expose credentials.
      - name: Preview obsolete Artifact Registry images
        continue-on-error: true
        run: node scripts/pdf-registry-cleanup.mjs --dry-run
      - name: Cleanup obsolete Artifact Registry images when separately enabled
        if: ${{ vars.PDF_REGISTRY_CLEANUP_ENABLED == 'true' }}
        continue-on-error: true
        env:
          PDF_REGISTRY_CLEANUP_ENABLED: 'true'
          PDF_REGISTRY_CLEANUP_CONFIRM: 'APPLY'
        run: node scripts/pdf-registry-cleanup.mjs --apply
