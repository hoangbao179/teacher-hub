name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_worker_release:
        description: Stage Worker from main after CI and API delivery (bootstrap/retry)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Fast quality gate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/pdf/package-lock.json
      - run: npm install -g npm@12.0.1
      - run: npm ci
      - run: npm run build:shared
      - run: npm ci --prefix workers/pdf
      - name: Install and verify PDF worker Linux runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf util-linux
          command -v qpdf
          command -v prlimit
          qpdf --version
          prlimit --version
      - run: npm --prefix workers/pdf run check
      - name: Install PDF worker headless browser
        working-directory: workers/pdf
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - run: npm --prefix workers/pdf test
      - run: node --test scripts/validate-pdf-environment.test.cjs
      - run: node --test scripts/pdf-vps-config.test.mjs
      - run: node --test scripts/pdf-v2-readiness.test.mjs scripts/dispatch-pdf-v2-readiness.test.cjs
      - run: node --test scripts/pdf-worker-auto-release.test.mjs scripts/pdf-registry-cleanup.test.mjs
      - run: node --test scripts/pdf-worker-changes.test.cjs scripts/pdf-worker-workflow.test.mjs
      - run: bash scripts/pdf-v2-deploy.test.sh
      - run: bash scripts/pdf-v2-deploy-flow.test.sh
      - run: bash -n scripts/pdf-recovery.sh
      - run: bash scripts/deploy-pdf-worker.test.sh
      - run: bash scripts/deploy-env.test.sh
      - run: npm run check:ci

  integration:
    name: Server integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: teacher_hub_test
          TZ: Asia/Ho_Chi_Minh
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpass --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      TZ: Asia/Ho_Chi_Minh
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: teacher_hub_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install -g npm@12.0.1
      - run: npm ci
      - run: npm run build:shared
      - run: npm run test:integration

  e2e-smoke:
    name: Production smoke E2E
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: teacher_hub_test
          TZ: Asia/Ho_Chi_Minh
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpass --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      TZ: Asia/Ho_Chi_Minh
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: teacher_hub_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      CHROME_PATH: /usr/bin/google-chrome
      SCREENSHOT_MODE: failure
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install -g npm@12.0.1
      - run: npm ci
      - run: npm run build:shared
      - name: Build client assets required by public Homepage smoke
        run: npm -w client run build:production
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-failure-artifacts
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 7

  schedule-regression:
    name: Schedule regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: teacher_hub_test
          TZ: Asia/Ho_Chi_Minh
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpass --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      TZ: Asia/Ho_Chi_Minh
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: teacher_hub_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      CHROME_PATH: /usr/bin/google-chrome
      SCREENSHOT_MODE: failure
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install -g npm@12.0.1
      - run: npm ci
      - run: npm run build:shared
      - run: npm run test:e2e:schedule
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: schedule-regression-failure-artifacts
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    name: Publish and deploy production
    if: ${{ github.repository == 'hoangbao179/teacher-hub' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_worker_release == true && vars.PDF_WORKER_AUTO_DEPLOY_ENABLED == 'true')) }}
    needs:
      - quality
      - integration
      - e2e-smoke
      - schedule-regression
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/deploy.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit

  pdf-worker-changes:
    name: Detect PDF Worker changes
    if: ${{ github.repository == 'hoangbao179/teacher-hub' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_worker_release == true)) && vars.PDF_WORKER_AUTO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare against verified Worker stage history
        id: diff
        uses: actions/github-script@v8
        with:
          script: await require('./scripts/pdf-worker-changes.cjs')(github, context, core);

  deploy-pdf-worker:
    name: Release Cloud Run PDF Worker after VPS deployment
    if: ${{ github.repository == 'hoangbao179/teacher-hub' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_worker_release == true)) && vars.PDF_WORKER_AUTO_DEPLOY_ENABLED == 'true' && needs.pdf-worker-changes.outputs.changed == 'true' }}
    needs:
      - deploy-production
      - pdf-worker-changes
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/pdf-worker-release.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
