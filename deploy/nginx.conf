server {
  listen 8080;
  server_name _;
  # Behind HTTPS Caddy: keep generated redirects relative to the public origin.
  # Otherwise /tools -> /tools/ may leak Nginx's internal :8080 port.
  absolute_redirect off;
  client_max_body_size 5m;
  root /usr/share/nginx/html;
  error_page 404 /404.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://cdn3.olm.vn; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.google.com https://taphuan.nxbgd.vn https://online.flipbuilder.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header X-Frame-Options "DENY" always;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Caddy replaces this header with the client socket IP. Do not append Caddy.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ^~ /api/public/learning-attempts/ {
    access_log off;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://api:4000/health; }
  location = /ready { proxy_pass http://api:4000/ready; }
  location = /admin {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://static.arasaac.org https://cdn.pixabay.com; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri /index.html;
  }
  location ^~ /admin/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://static.arasaac.org https://cdn.pixabay.com; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri /index.html;
  }
  location ^~ /play/ {
    access_log off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri /index.html;
  }
  location = /hoc {
    try_files /hoc/index.html /index.html;
  }
  location ^~ /hoc/ {
    try_files $uri $uri/ /index.html;
  }
  location = /sach {
    try_files /sach/index.html /index.html;
  }
  location ^~ /sach/ {
    try_files $uri $uri/ /index.html;
  }
  # /tools has a prerendered directory; explicitly normalize with a relative URL.
  location = /tools {
    return 308 /tools/;
  }
  location / {
    try_files $uri $uri/ =404;
  }
  location = /404.html {
    internal;
  }
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|avif|woff2)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://cdn3.olm.vn; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.google.com https://taphuan.nxbgd.vn https://online.flipbuilder.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
  }
}
