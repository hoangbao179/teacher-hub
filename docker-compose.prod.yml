services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: teacher_class_hub
      MYSQL_USER: teacher_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      TZ: Asia/Ho_Chi_Minh
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-time-zone=+07:00",
        "--innodb-buffer-pool-size=256M",
        "--max-connections=50",
      ]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DB_PASSWORD: ${DB_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_DRIVE_OWNER_LABEL: ${GOOGLE_DRIVE_OWNER_LABEL:-Cô Vy}
      GOOGLE_SHEETS_TEMPLATE_VERSION: ${GOOGLE_SHEETS_TEMPLATE_VERSION:-v2}
      GOOGLE_SHEET_SYNC_ENABLED: ${GOOGLE_SHEET_SYNC_ENABLED:-false}
      GOOGLE_SHEET_SYNC_INTERVAL_MS: ${GOOGLE_SHEET_SYNC_INTERVAL_MS:-30000}
      GOOGLE_SHEET_SYNC_BATCH_SIZE: ${GOOGLE_SHEET_SYNC_BATCH_SIZE:-20}
      GOOGLE_SHEET_SYNC_MAX_ATTEMPTS: ${GOOGLE_SHEET_SYNC_MAX_ATTEMPTS:-8}
      GOOGLE_SHEET_SYNC_LOCK_TIMEOUT_MS: ${GOOGLE_SHEET_SYNC_LOCK_TIMEOUT_MS:-600000}
      PIXABAY_ENABLED: ${PIXABAY_ENABLED:-false}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      VOCABULARY_MEDIA_STORAGE_PATH: /app/data/vocabulary-media
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-https://tienganhcovy.com}
      PUBLIC_LEARNING_ASSET_PATH: /app/public-learning-assets
    volumes:
      - vocabulary-media:/app/data/vocabulary-media
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["80:8080"]
volumes:
  mysql-data:
  vocabulary-media:
